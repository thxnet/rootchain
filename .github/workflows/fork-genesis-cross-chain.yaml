name: Fork Genesis Cross-Chain Verification

on:
  workflow_dispatch:
    inputs:
      polkadot_bin:
        description: Absolute path to the relay binary
        required: true
        default: /root/Works/rootchain/target/release/polkadot
        type: string
      leafchain_bin:
        description: Absolute path to the leafchain binary
        required: true
        default: /root/Works/leafchains/target/release/thxnet-leafchain
        type: string
      para_json:
        description: Absolute path to the parachain spec JSON used by --register-leafchain
        required: true
        default: /tmp/w6-t3-verify.json
        type: string
      seed_db:
        description: Absolute path to the read-only rootchain seed DB
        required: true
        default: /data/forknet-test/rootchain-seed
        type: string
      relay_chain:
        description: Relay chain name passed to polkadot fork-genesis --chain
        required: true
        default: thxnet-testnet
        type: string
      para_chain_id:
        description: Parachain chain id used for keystore layout
        required: true
        default: sand_testnet
        type: string
      register_para_id:
        description: Para id to register in the regenerated relay spec
        required: true
        default: "1003"
        type: string
      burn_in_seconds:
        description: Burn-in duration after liveness gates pass
        required: true
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: fork-genesis-cross-chain
  cancel-in-progress: false

jobs:
  verify-cross-chain:
    name: verify-cross-chain.sh
    runs-on: [self-hosted, hetzner-thxnet]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate prerequisites
        shell: bash
        run: |
          set -euo pipefail
          RUN_ROOT="${RUNNER_TEMP}/verify-cross-chain-${{ github.run_id }}-${{ github.run_attempt }}"
          RELAY_JSON="${RUN_ROOT}/artifacts/forked-thxnet-testnet-w8.json"
          POLKADOT_BIN="${{ github.event.inputs.polkadot_bin || '/root/Works/rootchain/target/release/polkadot' }}"
          LEAFCHAIN_BIN="${{ github.event.inputs.leafchain_bin || '/root/Works/leafchains/target/release/thxnet-leafchain' }}"
          PARA_JSON="${{ github.event.inputs.para_json || '/tmp/w6-t3-verify.json' }}"
          SEED_DB="${{ github.event.inputs.seed_db || '/data/forknet-test/rootchain-seed' }}"
          command -v lsof >/dev/null
          [[ -x "$POLKADOT_BIN" ]]
          [[ -x "$LEAFCHAIN_BIN" ]]
          [[ -f "$PARA_JSON" ]]
          [[ -d "$SEED_DB" ]]
          mkdir -p "$RUN_ROOT/artifacts"
          {
            echo "VERIFY_CROSS_CHAIN_RUN_ROOT=$RUN_ROOT"
            echo "VERIFY_CROSS_CHAIN_RELAY_JSON=$RELAY_JSON"
          } >> "$GITHUB_ENV"

      - name: Run verify-cross-chain.sh
        shell: bash
        run: |
          set -euo pipefail
          export VERIFY_CROSS_CHAIN_POLKADOT_BIN="${{ github.event.inputs.polkadot_bin || '/root/Works/rootchain/target/release/polkadot' }}"
          export VERIFY_CROSS_CHAIN_LEAFCHAIN_BIN="${{ github.event.inputs.leafchain_bin || '/root/Works/leafchains/target/release/thxnet-leafchain' }}"
          export VERIFY_CROSS_CHAIN_PARA_JSON="${{ github.event.inputs.para_json || '/tmp/w6-t3-verify.json' }}"
          export VERIFY_CROSS_CHAIN_SEED_DB="${{ github.event.inputs.seed_db || '/data/forknet-test/rootchain-seed' }}"
          export VERIFY_CROSS_CHAIN_REGISTER_PARA_ID="${{ github.event.inputs.register_para_id || '1003' }}"
          export VERIFY_CROSS_CHAIN_RELAY_CHAIN="${{ github.event.inputs.relay_chain || 'thxnet-testnet' }}"
          export VERIFY_CROSS_CHAIN_PARA_CHAIN_ID="${{ github.event.inputs.para_chain_id || 'sand_testnet' }}"
          bash scripts/fork-genesis/verify-cross-chain.sh \
            --burn-in-seconds="${{ github.event.inputs.burn_in_seconds || '300' }}" \
            --run-root="$VERIFY_CROSS_CHAIN_RUN_ROOT"

      - name: Upload cross-chain verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-genesis-cross-chain-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ env.VERIFY_CROSS_CHAIN_RUN_ROOT }}/logs/**
            ${{ env.VERIFY_CROSS_CHAIN_RUN_ROOT }}/pids/**
            ${{ env.VERIFY_CROSS_CHAIN_RELAY_JSON }}

      - name: Append summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$VERIFY_CROSS_CHAIN_RUN_ROOT/logs"
          {
            echo "## verify-cross-chain.sh"
            echo
            echo "- Runner labels: `self-hosted, hetzner-thxnet`"
            echo "- Relay binary: \`${{ github.event.inputs.polkadot_bin || '/root/Works/rootchain/target/release/polkadot' }}\`"
            echo "- Leafchain binary: \`${{ github.event.inputs.leafchain_bin || '/root/Works/leafchains/target/release/thxnet-leafchain' }}\`"
            echo "- Para spec: \`${{ github.event.inputs.para_json || '/tmp/w6-t3-verify.json' }}\`"
            echo "- Seed DB: \`${{ github.event.inputs.seed_db || '/data/forknet-test/rootchain-seed' }}\`"
            echo "- Run root: \`${VERIFY_CROSS_CHAIN_RUN_ROOT}\`"
            echo
            if [[ -d "$LOG_DIR" ]]; then
              echo "### Run-root log files"
              find "$LOG_DIR" -maxdepth 1 -type f | sort | sed 's/^/- `/' | sed 's/$/`/'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
